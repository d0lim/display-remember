name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test
        run: swift test --build-system native
      - name: Build local app bundle
        run: scripts/build-app.sh
      - name: Check bundle and CLI
        run: |
          codesign --verify --deep --strict "dist/Display Remember.app"
          "dist/Display Remember.app/Contents/MacOS/display-remember" --version
          "dist/Display Remember.app/Contents/MacOS/display-remember" --help
          "dist/Display Remember.app/Contents/MacOS/display-remember" displayplacer --version
      - name: Check Homebrew-style CLI symlink
        run: |
          ln -s "$GITHUB_WORKSPACE/dist/Display Remember.app/Contents/MacOS/display-remember" "$RUNNER_TEMP/display-remember"
          cd "$RUNNER_TEMP"
          ./display-remember displayplacer --version
      - name: Render fictional demos in both languages
        run: |
          "dist/Display Remember.app/Contents/MacOS/DisplayRemember" --render-demo "$RUNNER_TEMP/display-remember-demo.png"
          "dist/Display Remember.app/Contents/MacOS/DisplayRemember" --render-demo-ko "$RUNNER_TEMP/display-remember-demo-ko.png"
          "dist/Display Remember.app/Contents/MacOS/DisplayRemember" --render-settings-demo "$RUNNER_TEMP/display-remember-settings.png"
          "dist/Display Remember.app/Contents/MacOS/DisplayRemember" --render-settings-demo-ko "$RUNNER_TEMP/display-remember-settings-ko.png"
